name: OMEGA-9 Security & CodeQL Analysis

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

  schedule:
    # Every Tuesday at 05:40 UTC
    - cron: "40 5 * * 2"

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: OMEGA-9 CodeQL (${{ matrix.language }})

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
            os: ubuntu-latest

          - language: python
            build-mode: none
            os: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

          queries: >
            security-extended,
            security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

      - name: OMEGA-9 Governance Summary
        if: always()
        run: |
          echo "======================================="
          echo "OMEGA-9 Governance Security Summary"
          echo "======================================="
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Branch     : $GITHUB_REF_NAME"
          echo "Commit      : $GITHUB_SHA"
          echo "Language    : ${{ matrix.language }}"
          echo "Status      : CodeQL analysis completed."
          echo "======================================="
```
